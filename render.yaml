# Render Blueprint: Dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: qrs-atlas
    runtime: docker
    plan: standard            # 2 GB RAM; the app needs ~1 GB (see docs/DEPLOYMENT.md)
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: QRS_AUTH_USER
        value: qrs
      - key: QRS_AUTH_PASSWORD
        sync: false           # you are asked for it when the Blueprint is created
      - key: QRS_ALLOW_TRAINING
        value: "true"
